<div class="max-w-md w-full space-y-8 mx-auto">
  <div>
    <a routerLink="/" class="text-4xl font-extrabold text-center block text-slate-800">Digital Grove</a>
    <h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-slate-900">
      Sign in to your account
    </h2>
    <p class="mt-2 text-center text-sm text-slate-600">
      Or
      <a routerLink="/register" class="font-medium text-black hover:underline">
        create a new account
      </a>
    </p>
  </div>

  <div class="bg-white py-8 px-4 shadow-xl sm:rounded-lg sm:px-10 border border-slate-200">
    <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="login()">
      <div>
        <label for="email-address" class="block text-sm font-medium text-slate-700">Email address</label>
        <div class="mt-1">
          <input id="email-address" formControlName="email" name="email" type="email" autocomplete="email" required class="bg-white appearance-none block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-gray-800 focus:border-gray-800 sm:text-sm">
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
        <div class="mt-1">
          <input id="password" formControlName="password" name="password" type="password" autocomplete="current-password" required class="bg-white appearance-none block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-gray-800 focus:border-gray-800 sm:text-sm">
        </div>
      </div>
      
      <div>
        <button type="submit" [disabled]="loginForm.invalid || isLoading()" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-black hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-800 disabled:bg-slate-400 disabled:cursor-not-allowed">
          @if (isLoading()) {
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Signing in...</span>
          } @else {
            <span>Sign in</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>
