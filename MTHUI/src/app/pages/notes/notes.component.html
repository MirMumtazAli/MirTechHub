<div class="space-y-12">
  <header class="text-center">
    <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 sm:text-5xl">
      <span class="block">Premium & Free</span>
      <span class="block text-gray-800">Study Notes</span>
    </h1>
    <p class="mt-3 max-w-md mx-auto text-base text-slate-500 sm:text-lg md:mt-5 md:text-xl">
      Unlock your potential with our curated collection of notes on cutting-edge technologies.
    </p>
  </header>

  <div class="mb-8 max-w-lg mx-auto">
    <input type="text"
           placeholder="Search for notes..."
           [value]="searchTerm()"
           (input)="onSearch($event)"
           class="bg-white w-full px-4 py-3 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent">
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 min-h-[400px]">
    @if (isLoading()) {
    @for (_ of [1,2,3,4,5,6,7,8]; track $index) {
    <app-product-card-skeleton></app-product-card-skeleton>
    }
    } @else {
    @for (note of paginatedNotes(); track note.id) {
    <app-product-card [product]="note"></app-product-card>
    } @empty {
    <p class="text-center text-slate-500 py-8 md:col-span-2 lg:col-span-3 xl:col-span-4">
      No notes found matching your search.
    </p>
    }
    }
  </div>

  <app-pagination [currentPage]="currentPage()"
                  [totalPages]="totalPages()"
                  [totalItems]="totalItems()"
                  [itemsPerPage]="itemsPerPage()"
                  (pageChange)="onPageChange($event)">
  </app-pagination>
</div>
