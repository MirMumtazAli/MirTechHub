
<div class="space-y-12">
  <header class="text-center">
    <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 sm:text-5xl">
      <span class="block">Premium & Free</span>
      <span class="block text-gray-800">Study Notes</span>
    </h1>
    <p class="mt-3 max-w-md mx-auto text-base text-slate-500 sm:text-lg md:mt-5 md:text-xl">
      Unlock your potential with our curated collection of notes on cutting-edge technologies.
    </p>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
    @for (note of notes(); track note.id) {
      <app-product-card [product]="note"></app-product-card>
    }
  </div>
</div>
