<div class="space-y-12">
  <header class="text-center">
    <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 sm:text-5xl">
      <span class="block">Powerful</span>
      <span class="block text-gray-800">Mini Software</span>
    </h1>
    <p class="mt-3 max-w-md mx-auto text-base text-slate-500 sm:text-lg md:mt-5 md:text-xl">
      Boost your productivity with our lightweight and efficient software utilities.
    </p>
  </header>

  <div class="mb-8 max-w-lg mx-auto">
    <input type="text"
           placeholder="Search for software..."
           [value]="searchTerm()"
           (input)="onSearch($event)"
           class="bg-white w-full px-4 py-3 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent">
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 min-h-[400px]">
    @for (item of paginatedSoftware(); track item.id) {
    <app-product-card [product]="item"></app-product-card>
    } @empty {
    <p class="text-center text-slate-500 py-8 md:col-span-2 lg:col-span-3 xl:col-span-4">
      No software found matching your search.
    </p>
    }
  </div>

  <app-pagination [currentPage]="currentPage()"
                  [totalPages]="totalPages()"
                  [totalItems]="totalItems()"
                  [itemsPerPage]="itemsPerPage()"
                  (pageChange)="onPageChange($event)">
  </app-pagination>
</div>
